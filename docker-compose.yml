services:
  postgres:
    container_name: postgres_test
    image: postgres
    volumes:
      - db-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/db.sql
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB="Delivery_Hub"
    networks:
      - test_fastapi
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 30s
      timeout: 10s
      retries: 3


  fastapi_test:
    build: .
    container_name: fastapi

    command:  sh -c "sleep 5 && alembic revision --autogenerate && alembic upgrade head && python /project/main.py"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test_fastapi
  nginx:
    image: nginx
    depends_on:
      - fastapi_test

    container_name: nginx_test

    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - test_fastapi
networks:
  test_fastapi:
    driver: bridge


volumes:
  db-data:
    name: data
